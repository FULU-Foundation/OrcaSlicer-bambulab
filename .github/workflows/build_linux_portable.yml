name: Build Linux Portable

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-linux-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_portable:
    name: Linux Portable (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            dist_id: ubuntu22.04
          - runner: ubuntu-24.04
            dist_id: ubuntu24.04
    uses: ./.github/workflows/linux_artifacts_reusable.yml
    with:
      runner: ${{ matrix.runner }}
      dist_id: ${{ matrix.dist_id }}
      mode: portable
      cache_rev: v1
    secrets: inherit
