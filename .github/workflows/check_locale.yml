name: Check locale

on:
    pull_request:
      branches:
       - main
      paths:
       - 'localization/**'
       - 'cmake/OrcaTranslations.cmake'
       - ".github/workflows/check_locale.yml"

jobs:
  check_translation:
    name: Check translation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      # Avoid full catalog updates here because translators may be working from older main snapshots.
      - name: Check translation format
        run: |
          cmake -P cmake/OrcaTranslations.cmake
