name: Build Linux AppImage

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_appimage_ubuntu24:
    uses: ./.github/workflows/linux_artifacts_reusable.yml
    with:
      runner: ubuntu-24.04
      dist_id: ubuntu24.04
      mode: appimage
      cache_rev: v1
    secrets: inherit
