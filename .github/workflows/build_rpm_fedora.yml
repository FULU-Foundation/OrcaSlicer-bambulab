name: Build RPM (Fedora)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-rpm-fedora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpm_fedora41:
    name: RPM (fedora-41)
    runs-on: ubuntu-24.04
    container:
      image: fedora:41
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DIST_ID: fedora41
      EVENT_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: Install system tools
        run: |
          set -euo pipefail
          dnf install -y \
            sudo \
            bash \
            ca-certificates \
            cmake \
            ccache \
            curl \
            file \
            findutils \
            git \
            gzip \
            ninja-build \
            rpm-build \
            tar \
            which

      - name: Compute version
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${GITHUB_REF_NAME:-}}"
          if [[ "$tag" == v* ]]; then
            ver="${tag#v}"
          else
            ver="git${GITHUB_SHA::7}"
          fi
          rpm_ver="$(printf '%s' "$ver" | tr -c 'A-Za-z0-9._' '_')"
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "RPM_VER=$rpm_ver" >> "$GITHUB_ENV"

      - name: Fedora - install Orca build dependencies
        run: |
          set -euo pipefail
          ./build_linux.sh -u

      - name: Fedora - build Orca dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build Linux deps attempt $attempt"
            if ./build_linux.sh -drlL; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient dependency download/build failure, retrying after backoff"
              sleep $((attempt * 20))
            else
              exit 1
            fi
          done

      - name: Fedora - configure and build
        run: |
          set -euo pipefail
          rm -rf build out
          mkdir -p out

          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_PREFIX_PATH="${PWD}/deps/build/OrcaSlicer_dep/usr/local" \
            -DSLIC3R_STATIC=1 \
            -DSLIC3R_GTK=3 \
            -DBBL_RELEASE_TO_PUBLIC=1 \
            -DBBL_INTERNAL_TESTING=0 \
            -DSLIC3R_PCH=ON \
            -DORCA_TOOLS=ON \
            -DORCA_BMCU_LINUX_PACKAGE=ON \
            -DORCA_CPACK_DIST_ID="${DIST_ID}" \
            -DORCA_CPACK_FILE_VERSION="${VER}" \
            -DORCA_CPACK_PACKAGE_VERSION="${RPM_VER}" \
            -DORCA_CPACK_ARCH=x86_64 \
            -DCMAKE_INSTALL_PREFIX=/opt/orcaslicer

          cmake --build build --config Release -j"$(nproc)"

      - name: Fedora - build RPM
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -G RPM -B out

      - name: Fedora - checksums
        run: |
          set -euo pipefail
          (cd out && sha256sum * > "SHA256SUMS_${DIST_ID}.txt")

      - name: Upload artifacts (RPM Fedora)
        uses: actions/upload-artifact@v7
        with:
          name: orcaslicer-bmcu-rpm-${{ env.DIST_ID }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
